name: dse-service-crm-test

services:
  postgres-test:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: dse_crm_test
      POSTGRES_USER: dse_crm_test
      POSTGRES_PASSWORD: dse_crm_test_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse_crm_test -d dse_crm_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
