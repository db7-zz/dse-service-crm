name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: dse_crm_test
          POSTGRES_USER: dse_crm_test
          POSTGRES_PASSWORD: dse_crm_test_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dse_crm_test -d dse_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://dse_crm_test:dse_crm_test_only@localhost:55432/dse_crm_test?schema=public
      TEST_DATABASE_URL: postgresql://dse_crm_test:dse_crm_test_only@localhost:55432/dse_crm_test?schema=public
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: Admin-Development-Only-123!
      SEED_BUTLER_USERNAME: butler
      SEED_BUTLER_PASSWORD: Butler-Development-Only-123!

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm openapi:generate
      - run: pnpm --filter @dse/api-client generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify generated contracts are committed
        run: git diff --exit-code docs/api/openapi.json packages/api-client/src/generated/schema.d.ts
