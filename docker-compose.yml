name: dse-service-crm

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dse_crm_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dse_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dse_crm_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dse_crm} -d ${POSTGRES_DB:-dse_crm_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [crm_internal]

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8080}
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-dse_crm}:${POSTGRES_PASSWORD:-dse_crm_dev_only}@postgres:5432/${POSTGRES_DB:-dse_crm_dev}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dse_session}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-7200}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-dse_csrf}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [crm_internal]

  migrate:
    build:
      context: .
      target: api
    command: ["pnpm", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dse_crm}:${POSTGRES_PASSWORD:-dse_crm_dev_only}@postgres:5432/${POSTGRES_DB:-dse_crm_dev}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [crm_internal]

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    networks: [crm_internal]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [crm_internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  crm_internal:
